name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip autoconf libtool pkg-config zlib1g-dev openjdk-17-jdk aidl
        python -m pip install --upgrade pip setuptools
        pip install cython==0.29.33 buildozer

    - name: Build APK with Buildozer
      run: |
        yes | buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,hostpython3/g' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/# android.api = 31/android.api = 31/g' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Automobile-Scanner-APK
        path: bin/*.apk
